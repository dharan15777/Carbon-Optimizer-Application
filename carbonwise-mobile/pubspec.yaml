name: carbonwise
description: CarbonWise - AI Carbon Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Google Maps
  google_maps_flutter: ^2.5.3

  # HTTP & API
  dio: ^5.4.0

  # Local storage (auth tokens)
  shared_preferences: ^2.2.2

  # Local notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
